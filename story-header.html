<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalium — Story Header Playground</title>
  <style>
    :root {
      --paper: #FAF9F7;
      --ink: #22304C;
      --muted: #8A93A6;
      --hair: #C9CFD9;
      --font: Arial, "Helvetica Neue", sans-serif;
      --page-max: 1080px;
      --pad-x: clamp(22px, 4.5vw, 48px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 3px;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: clamp(28px, 5vw, 48px) var(--pad-x) 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* —— Chrome over the field —— */
    .form-head {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      column-gap: 0.55em;
      row-gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: transparent;
      width: 100vw;
      margin-left: calc(50% - 50vw);
      padding: 14px max(var(--pad-x), calc(50vw - var(--page-max) / 2 + var(--pad-x))) 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1;
      white-space: nowrap;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-rule {
      display: block;
      height: 1px;
      width: 100%;
      background: var(--ink);
      opacity: 0.85;
      margin-top: 0.12em;
    }

    .field-switch {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 22px;
    }

    .no-js .field-switch {
      display: none;
    }

    .field-switch button {
      appearance: none;
      background: var(--paper);
      box-shadow: 0 0 0 5px var(--paper);
      border: 0;
      border-bottom: 1px solid transparent;
      padding: 0 0 3px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      line-height: 1.2;
    }

    .field-switch button:hover {
      color: var(--ink);
    }

    .field-switch button[aria-pressed="true"] {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    main {
      margin-top: auto;
    }

    .note {
      padding: 20px 0 28px;
      max-width: 36ch;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
      color: var(--muted);
    }

    /* —— Full-viewport SVG field —— */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .field {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    .field.is-active {
      display: block;
    }

    /* Orbits — structure-atom grammar, 16 / 26 / 36s */
    .orbit {
      transform-box: view-box;
      transform-origin: var(--ox, 400px) var(--oy, 100px);
      animation: orbit-spin var(--spin, 20s) linear infinite;
    }

    @keyframes orbit-spin {
      to { transform: rotate(360deg); }
    }

    /* Drift — unbound wealth, slower and header-scale */
    @keyframes wealth-drift-a {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(14px, -10px); }
      50% { transform: translate(-8px, 12px); }
      75% { transform: translate(11px, 7px); }
    }

    @keyframes wealth-drift-b {
      0%, 100% { transform: translate(0, 0); }
      30% { transform: translate(-12px, 11px); }
      55% { transform: translate(10px, -13px); }
      80% { transform: translate(-8px, -7px); }
    }

    @keyframes wealth-drift-c {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(9px, 13px); }
      45% { transform: translate(-12px, -9px); }
      70% { transform: translate(13px, -6px); }
    }

    @keyframes wealth-drift-d {
      0%, 100% { transform: translate(0, 0); }
      35% { transform: translate(-11px, -12px); }
      60% { transform: translate(12px, 8px); }
      85% { transform: translate(6px, -11px); }
    }

    .wealth-drift {
      transform-box: fill-box;
      transform-origin: center;
    }

    .wealth-drift:nth-child(4n + 1) {
      animation: wealth-drift-a 11s ease-in-out infinite;
      animation-delay: calc(var(--g, 0) * -0.18s);
    }

    .wealth-drift:nth-child(4n + 2) {
      animation: wealth-drift-b 15s ease-in-out infinite;
      animation-delay: calc(var(--g, 0) * -0.22s);
    }

    .wealth-drift:nth-child(4n + 3) {
      animation: wealth-drift-c 9s ease-in-out infinite;
      animation-delay: calc(var(--g, 0) * -0.16s);
    }

    .wealth-drift:nth-child(4n + 4) {
      animation: wealth-drift-d 13s ease-in-out infinite;
      animation-delay: calc(var(--g, 0) * -0.24s);
    }

    /* Flow — parked dots only when motion is off */
    .flow-parked { display: none; }

    /* Grid — plate breathe + dashed-arc crawl */
    .plate {
      opacity: 0.12;
      animation: plate-breathe 18s ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }

    @keyframes plate-breathe {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.18; }
    }

    .arc-crawl {
      animation: arc-crawl var(--crawl, 28s) linear infinite;
    }

    @keyframes arc-crawl {
      to { stroke-dashoffset: -56; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }

      .orbit,
      .wealth-drift,
      .plate,
      .arc-crawl {
        animation: none !important;
      }

      .flow-couriers { display: none; }
      .flow-parked { display: block; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <!-- 1. Orbits (default) — watermark Bohr atom, story shell grammar -->
    <svg class="field field-orbits is-active" data-field="orbits" viewBox="0 0 1440 900" preserveAspectRatio="xMinYMin slice" fill="none">
      <g stroke="#22304C" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.15">
        <circle cx="400" cy="100" r="10" fill="#22304C" stroke="none"/>
        <circle cx="400" cy="100" r="104"/>
        <circle cx="400" cy="100" r="176"/>
        <circle cx="400" cy="100" r="248"/>
        <circle cx="400" cy="100" r="284" stroke-dasharray="3 4"/>
        <circle cx="400" cy="100" r="410" stroke-dasharray="4 5"/>
      </g>
      <g class="orbit" style="--ox:400px; --oy:100px; --spin:16s" fill="#22304C" opacity="0.20">
        <circle cx="400" cy="-4" r="2.5" stroke="none"/>
        <circle cx="490" cy="152" r="2.5" stroke="none"/>
        <circle cx="310" cy="152" r="2.5" stroke="none"/>
      </g>
      <g class="orbit" style="--ox:400px; --oy:100px; --spin:26s" fill="#22304C" opacity="0.20">
        <circle cx="524.4" cy="-24.4" r="2.5" stroke="none"/>
        <circle cx="576" cy="100" r="2.5" stroke="none"/>
        <circle cx="339.8" cy="265.4" r="2.5" stroke="none"/>
      </g>
      <g class="orbit" style="--ox:400px; --oy:100px; --spin:36s" fill="#22304C" opacity="0.20">
        <circle cx="400" cy="-148" r="2.5" stroke="none"/>
        <circle cx="614.8" cy="224" r="2.5" stroke="none"/>
        <circle cx="185.2" cy="224" r="2.5" stroke="none"/>
        <circle cx="524" cy="314.8" r="2.5" stroke="none"/>
      </g>
    </svg>

    <!-- 2. Drift — sparse unbound-wealth cloud -->
    <svg class="field field-drift" data-field="drift" viewBox="0 0 1440 900" preserveAspectRatio="xMinYMin slice" fill="none">
      <g class="drift-cloud" fill="#22304C" stroke="none" opacity="0.20">
        <circle class="wealth-drift" style="--g:0" cx="86" cy="52" r="2.2"/>
        <circle class="wealth-drift" style="--g:1" cx="210" cy="96" r="1.8"/>
        <circle class="wealth-drift" style="--g:2" cx="348" cy="38" r="2.6"/>
        <circle class="wealth-drift" style="--g:3" cx="492" cy="118" r="2"/>
        <circle class="wealth-drift" style="--g:4" cx="640" cy="64" r="2.4"/>
        <circle class="wealth-drift" style="--g:5" cx="788" cy="142" r="1.8"/>
        <circle class="wealth-drift" style="--g:6" cx="940" cy="48" r="2.2"/>
        <circle class="wealth-drift" style="--g:7" cx="1088" cy="108" r="2"/>
        <circle class="wealth-drift" style="--g:8" cx="1240" cy="72" r="2.4"/>
        <circle class="wealth-drift" style="--g:9" cx="168" cy="220" r="2"/>
        <circle class="wealth-drift" style="--g:10" cx="560" cy="248" r="2.6"/>
        <circle class="wealth-drift" style="--g:11" cx="860" cy="280" r="1.8"/>
        <circle class="wealth-drift" style="--g:12" cx="1180" cy="236" r="2.2"/>
        <circle class="wealth-drift" style="--g:13" cx="420" cy="400" r="2"/>
        <circle class="wealth-drift" style="--g:14" cx="1020" cy="430" r="2.4"/>
      </g>
    </svg>

    <!-- 3. Flow — hairline return paths, courier dots -->
    <svg class="field field-flow" data-field="flow" viewBox="0 0 1440 900" preserveAspectRatio="xMinYMin slice" fill="none">
      <g stroke="#22304C" stroke-width="1.15" stroke-linecap="round" fill="none" opacity="0.12">
        <path id="flow-path-a" d="M -40 88 C 240 40, 560 130, 1480 72"/>
        <path id="flow-path-b" d="M -20 128 C 300 180, 720 60, 1500 140"/>
        <path id="flow-path-c" d="M -60 56 C 400 90, 880 24, 1520 100"/>
      </g>
      <g class="flow-couriers" fill="#22304C" opacity="0.20">
        <circle r="2.3" stroke="none">
          <animateMotion dur="18s" repeatCount="indefinite" begin="0s">
            <mpath href="#flow-path-a"/>
          </animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="18s" repeatCount="indefinite" begin="0s"/>
        </circle>
        <circle r="2" stroke="none">
          <animateMotion dur="18s" repeatCount="indefinite" begin="9s">
            <mpath href="#flow-path-a"/>
          </animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="18s" repeatCount="indefinite" begin="9s"/>
        </circle>
        <circle r="2.3" stroke="none">
          <animateMotion dur="22s" repeatCount="indefinite" begin="3s">
            <mpath href="#flow-path-b"/>
          </animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="22s" repeatCount="indefinite" begin="3s"/>
        </circle>
        <circle r="2" stroke="none">
          <animateMotion dur="22s" repeatCount="indefinite" begin="14s">
            <mpath href="#flow-path-b"/>
          </animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="22s" repeatCount="indefinite" begin="14s"/>
        </circle>
        <circle r="2.2" stroke="none">
          <animateMotion dur="16s" repeatCount="indefinite" begin="5s">
            <mpath href="#flow-path-c"/>
          </animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="16s" repeatCount="indefinite" begin="5s"/>
        </circle>
        <circle r="1.9" stroke="none">
          <animateMotion dur="16s" repeatCount="indefinite" begin="12s">
            <mpath href="#flow-path-c"/>
          </animateMotion>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="16s" repeatCount="indefinite" begin="12s"/>
        </circle>
      </g>
      <g class="flow-parked" fill="#22304C" opacity="0.20">
        <circle cx="186" cy="74" r="2.3" stroke="none"/>
        <circle cx="720" cy="96" r="2" stroke="none"/>
        <circle cx="240" cy="150" r="2.3" stroke="none"/>
        <circle cx="820" cy="98" r="2" stroke="none"/>
        <circle cx="210" cy="68" r="2.2" stroke="none"/>
        <circle cx="900" cy="52" r="1.9" stroke="none"/>
      </g>
    </svg>

    <!-- 4. Grid — form plates + dashed concentric arcs -->
    <svg class="field field-grid" data-field="grid" viewBox="0 0 1440 900" preserveAspectRatio="xMinYMin slice" fill="none">
      <g stroke="#22304C" stroke-width="1" stroke-linecap="round">
        <line class="plate" style="--d:0s" x1="40" y1="44" x2="1320" y2="44"/>
        <line class="plate" style="--d:2.2s" x1="40" y1="88" x2="1180" y2="88"/>
        <line class="plate" style="--d:4.4s" x1="40" y1="132" x2="1260" y2="132"/>
        <line class="plate" style="--d:1.1s" x1="40" y1="176" x2="980" y2="176"/>
        <line class="plate" style="--d:3.3s" x1="40" y1="220" x2="1220" y2="220"/>
        <line class="plate" style="--d:5.5s" x1="40" y1="264" x2="1080" y2="264"/>
        <line class="plate" style="--d:0.8s" x1="40" y1="308" x2="1280" y2="308"/>
        <line class="plate" style="--d:6s" x1="40" y1="352" x2="920" y2="352"/>
      </g>
      <g transform="translate(400 100)" stroke="#22304C" stroke-width="1.15" fill="none" stroke-linecap="round" opacity="0.16">
        <circle class="arc-crawl" style="--crawl:24s" r="120" stroke-dasharray="4 8"/>
        <circle class="arc-crawl" style="--crawl:32s" r="200" stroke-dasharray="3 7"/>
        <circle class="arc-crawl" style="--crawl:40s" r="300" stroke-dasharray="5 9"/>
      </g>
    </svg>
  </div>

  <div class="page">
    <header class="form-head" aria-label="Document header">
      <a class="brand" href="index.html">Kalium</a>
      <span class="brand-rule" aria-hidden="true"></span>
      <div class="field-switch" role="group" aria-label="Background field">
        <button type="button" data-field="orbits" aria-pressed="true">Orbits</button>
        <button type="button" data-field="drift" aria-pressed="false">Drift</button>
        <button type="button" data-field="flow" aria-pressed="false">Flow</button>
        <button type="button" data-field="grid" aria-pressed="false">Grid</button>
      </div>
    </header>

    <main>
      <h1 class="note">Header experiment. Animated SVG fields behind the Kalium chrome.</h1>
    </main>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      root.classList.remove('no-js');
      root.classList.add('js');

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      function pauseMotion() {
        if (!reduce.matches) return;
        document.querySelectorAll('.stage svg').forEach(function (svg) {
          if (svg.pauseAnimations) svg.pauseAnimations();
        });
      }
      pauseMotion();
      if (reduce.addEventListener) {
        reduce.addEventListener('change', pauseMotion);
      }

      var switcher = document.querySelector('.field-switch');
      if (!switcher) return;
      var buttons = switcher.querySelectorAll('[data-field]');
      var fields = document.querySelectorAll('.stage .field');

      switcher.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-field]');
        if (!btn) return;
        var name = btn.getAttribute('data-field');
        buttons.forEach(function (b) {
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        fields.forEach(function (f) {
          f.classList.toggle('is-active', f.getAttribute('data-field') === name);
        });
      });
    })();
  </script>
</body>
</html>
