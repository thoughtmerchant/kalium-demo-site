<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" fill="none" role="img" aria-labelledby="modes-title modes-desc">
  <title id="modes-title">Four modes of public benefit</title>
  <desc id="modes-desc">Two families of public benefit: effects beyond the enterprise, and distribution of value the enterprise creates. Four modes sit under those families.</desc>

  <g stroke="#0B1F3A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
     font-family="Arial, Helvetica, sans-serif" fill="#0B1F3A">

    <!-- Family A -->
    <g transform="translate(40 56)">
      <text x="160" y="0" text-anchor="middle" stroke="none"
            font-size="11" letter-spacing="0.18em">EFFECT ON THE WORLD</text>
      <line x1="0" y1="16" x2="320" y2="16" opacity="0.45"/>

      <g transform="translate(0 48)">
        <rect x="0" y="0" width="148" height="100" fill="none"/>
        <circle cx="74" cy="32" r="14" fill="none"/>
        <circle cx="74" cy="32" r="3" stroke="none"/>
        <text x="74" y="68" text-anchor="middle" stroke="none" font-size="12">Net-new</text>
        <text x="74" y="86" text-anchor="middle" stroke="none" opacity="0.55" font-size="11">public good</text>
      </g>

      <g transform="translate(172 48)">
        <rect x="0" y="0" width="148" height="100" fill="none"/>
        <path d="M 54 24 L 74 44 L 94 24" fill="none"/>
        <line x1="74" y1="44" x2="74" y2="48" opacity="0.6"/>
        <text x="74" y="68" text-anchor="middle" stroke="none" font-size="12">Reduce</text>
        <text x="74" y="86" text-anchor="middle" stroke="none" opacity="0.55" font-size="11">externality</text>
      </g>
    </g>

    <!-- Family B -->
    <g transform="translate(400 56)">
      <text x="140" y="0" text-anchor="middle" stroke="none"
            font-size="11" letter-spacing="0.18em">VALUE DISTRIBUTION</text>
      <line x1="0" y1="16" x2="280" y2="16" opacity="0.45"/>

      <g transform="translate(0 48)">
        <rect x="0" y="0" width="128" height="100" fill="none"/>
        <circle cx="44" cy="32" r="8" fill="none"/>
        <circle cx="64" cy="32" r="8" fill="none"/>
        <circle cx="84" cy="32" r="8" fill="none"/>
        <text x="64" y="68" text-anchor="middle" stroke="none" font-size="12">Share</text>
        <text x="64" y="86" text-anchor="middle" stroke="none" opacity="0.55" font-size="11">upside</text>
      </g>

      <g transform="translate(152 48)">
        <rect x="0" y="0" width="128" height="100" fill="none"/>
        <line x1="32" y1="40" x2="96" y2="24" opacity="0.85"/>
        <circle cx="32" cy="40" r="3" stroke="none"/>
        <circle cx="96" cy="24" r="3" stroke="none"/>
        <text x="64" y="68" text-anchor="middle" stroke="none" font-size="12">Lower</text>
        <text x="64" y="86" text-anchor="middle" stroke="none" opacity="0.55" font-size="11">cost of access</text>
      </g>
    </g>

    <line x1="40" y1="280" x2="680" y2="280" opacity="0.35"/>
    <text x="360" y="310" text-anchor="middle" stroke="none" opacity="0.55"
          font-size="10" letter-spacing="0.18em">INSTRUMENT FIXES SURPLUS DESTINATION · NOT WHICH MODE</text>
  </g>
</svg>
