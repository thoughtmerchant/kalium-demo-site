<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none" role="img" aria-labelledby="annex-title annex-desc">
  <title id="annex-title">Aligned equity instrument</title>
  <desc id="annex-desc">Ordinary equity terms plus a public good annex specifying return ceiling, public good definition, and governance. Below the cap the instrument behaves normally; above it, surplus redirects to public ends.</desc>

  <g stroke="#0B1F3A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
     font-family="Arial, Helvetica, sans-serif" fill="#0B1F3A">

    <!-- Base equity block -->
    <g transform="translate(40 48)">
      <rect x="0" y="0" width="240" height="120" fill="none"/>
      <text x="120" y="-14" text-anchor="middle" stroke="none"
            font-size="11" letter-spacing="0.2em">ORDINARY EQUITY</text>
      <line x1="24" y1="36" x2="216" y2="36" opacity="0.35"/>
      <line x1="24" y1="56" x2="180" y2="56" opacity="0.35"/>
      <line x1="24" y1="76" x2="200" y2="76" opacity="0.35"/>
      <text x="120" y="104" text-anchor="middle" stroke="none" opacity="0.55"
            font-size="11">Standard stage terms</text>
    </g>

    <!-- Plus -->
    <g transform="translate(320 108)" opacity="0.7">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
    </g>

    <!-- Annex -->
    <g transform="translate(360 40)">
      <rect x="0" y="0" width="320" height="136" fill="none"/>
      <text x="160" y="-14" text-anchor="middle" stroke="none"
            font-size="11" letter-spacing="0.2em">PUBLIC GOOD ANNEX</text>

      <g transform="translate(20 28)">
        <circle cx="8" cy="8" r="8" fill="none"/>
        <text x="8" y="12" text-anchor="middle" stroke="none" font-size="10">1</text>
        <text x="28" y="12" stroke="none" font-size="12">Ceiling on financial return</text>
      </g>
      <g transform="translate(20 60)">
        <circle cx="8" cy="8" r="8" fill="none"/>
        <text x="8" y="12" text-anchor="middle" stroke="none" font-size="10">2</text>
        <text x="28" y="12" stroke="none" font-size="12">Definition of the public good</text>
      </g>
      <g transform="translate(20 92)">
        <circle cx="8" cy="8" r="8" fill="none"/>
        <text x="8" y="12" text-anchor="middle" stroke="none" font-size="10">3</text>
        <text x="28" y="12" stroke="none" font-size="12">Governance over time</text>
      </g>
    </g>

    <!-- Behavior split -->
    <line x1="40" y1="220" x2="680" y2="220" opacity="0.25"/>

    <g transform="translate(40 250)">
      <rect x="0" y="0" width="300" height="88" fill="none" opacity="0.85"/>
      <line x1="0" y1="0" x2="300" y2="0" stroke-width="1.5"/>
      <text x="150" y="36" text-anchor="middle" stroke="none"
            font-size="11" letter-spacing="0.18em">BELOW CAP</text>
      <text x="150" y="58" text-anchor="middle" stroke="none" opacity="0.6"
            font-size="12">Behaves like any other investment</text>
    </g>

    <g transform="translate(380 250)">
      <rect x="0" y="0" width="300" height="88" fill="none" opacity="0.85"/>
      <line x1="0" y1="0" x2="300" y2="0" stroke-width="1.5"/>
      <text x="150" y="36" text-anchor="middle" stroke="none"
            font-size="11" letter-spacing="0.18em">ABOVE CAP</text>
      <text x="150" y="58" text-anchor="middle" stroke="none" opacity="0.6"
            font-size="12">Surplus redirected to public ends</text>
    </g>
  </g>
</svg>
