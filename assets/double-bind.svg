<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" fill="none" role="img" aria-labelledby="bind-title bind-desc">
  <title id="bind-title">The double bind</title>
  <desc id="bind-desc">Enterprises hold capacity without a public mandate; foundations hold a mandate without enterprise capacity. Capital sits disconnected between them.</desc>

  <g stroke="#0B1F3A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
     font-family="Arial, Helvetica, sans-serif" fill="#0B1F3A">

    <!-- Left: Enterprise -->
    <g transform="translate(80 70)">
      <rect x="0" y="0" width="200" height="160" fill="none"/>
      <text x="100" y="-18" text-anchor="middle" stroke="none"
            font-size="11" letter-spacing="0.22em">ENTERPRISE</text>
      <circle cx="100" cy="58" r="28" fill="none"/>
      <circle cx="100" cy="58" r="14" fill="none" opacity="0.55"/>
      <circle cx="100" cy="58" r="3.2" stroke="none"/>
      <text x="100" y="112" text-anchor="middle" stroke="none"
            font-size="12">Capacity</text>
      <text x="100" y="132" text-anchor="middle" stroke="none" opacity="0.55"
            font-size="11">without mandate</text>
    </g>

    <!-- Gap / capital -->
    <g transform="translate(360 150)">
      <line x1="-60" y1="0" x2="-28" y2="0" stroke-dasharray="2 4" opacity="0.45"/>
      <line x1="28" y1="0" x2="60" y2="0" stroke-dasharray="2 4" opacity="0.45"/>
      <circle r="22" fill="none" stroke-dasharray="1.5 3.5" opacity="0.7"/>
      <circle r="4" stroke="none" opacity="0.85"/>
      <text y="52" text-anchor="middle" stroke="none" opacity="0.55"
            font-size="10" letter-spacing="0.16em">CAPITAL</text>
      <text y="68" text-anchor="middle" stroke="none" opacity="0.4"
            font-size="10">disconnected</text>
    </g>

    <!-- Right: Foundation -->
    <g transform="translate(440 70)">
      <rect x="0" y="0" width="200" height="160" fill="none"/>
      <text x="100" y="-18" text-anchor="middle" stroke="none"
            font-size="11" letter-spacing="0.22em">FOUNDATION</text>
      <rect x="72" y="34" width="56" height="48" fill="none"/>
      <line x1="72" y1="46" x2="128" y2="46" opacity="0.5"/>
      <line x1="72" y1="58" x2="128" y2="58" opacity="0.5"/>
      <line x1="72" y1="70" x2="116" y2="70" opacity="0.5"/>
      <text x="100" y="112" text-anchor="middle" stroke="none"
            font-size="12">Mandate</text>
      <text x="100" y="132" text-anchor="middle" stroke="none" opacity="0.55"
            font-size="11">without capacity</text>
    </g>

    <line x1="40" y1="280" x2="680" y2="280" opacity="0.35"/>
    <text x="360" y="304" text-anchor="middle" stroke="none" opacity="0.55"
          font-size="10" letter-spacing="0.2em">DOUBLE BIND</text>
  </g>
</svg>
