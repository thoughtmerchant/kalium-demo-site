  <title id="t13">Kalium — Three operations, plate 13</title>
  <desc id="d13">An enterprise cell meets a junction and splits into three operations: net new, shift, and repair.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .serif { font-family: Times, "Times New Roman", serif; }
  </style>
  <defs>
