    <text x="1018" y="118" text-anchor="middle" fill="#22304C" stroke="none"
          font-size="10" font-weight="700" letter-spacing="2">PUBLIC GOOD</text>
  </g>

  <!-- AGREEMENT (red) -->
  <g stroke="#C8362B" fill="#C8362B">
    <circle cx="470" cy="400" r="5.6"/>
    <line x1="470" y1="406" x2="470" y2="422" stroke-width="0.85" fill="none"/>
  </g>
  <text x="470" y="438" text-anchor="middle" fill="#C8362B" font-size="8.5" font-weight="700" letter-spacing="1.8">AGREEMENT</text>

</svg>
