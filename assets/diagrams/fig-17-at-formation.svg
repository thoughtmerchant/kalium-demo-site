<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none"
     role="img" aria-labelledby="t17 d17">
  <title id="t17">Kalium — At formation, plate 17</title>
  <desc id="d17">A capped path meets an agreement inside a hexagon; private-return loops remain inside, then surplus leaves toward a public-good constellation.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .serif { font-family: Times, "Times New Roman", serif; }
  </style>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0.6,0.8 L8,4 L0.6,7.2" fill="none" stroke="#22304C" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0.6,0.8 L8,4 L0.6,7.2" fill="none" stroke="#C8362B" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="28" y="28" width="1144" height="744" stroke="#22304C" stroke-width="1.05"/>
  <rect x="35.5" y="35.5" width="1129" height="729" stroke="#22304C" stroke-width="0.45"/>

  <text x="52" y="62" fill="#C8362B" font-size="11" font-weight="700" letter-spacing="2.4">FIG. 17</text>

  <text x="600" y="66" text-anchor="middle" fill="#22304C" font-size="13" font-weight="700" letter-spacing="4.4">AT FORMATION</text>
  <line x1="500" y1="78" x2="700" y2="78" stroke="#22304C" stroke-width="0.55"/>
  <circle cx="600" cy="78" r="2.2" fill="#22304C" stroke="none"/>
  <text x="52" y="748" fill="#22304C" font-size="15.5" class="serif" font-style="italic">The agreement precedes the surplus.</text>
  <line x1="52" y1="758" x2="168" y2="758" stroke="#22304C" stroke-width="0.5"/>

  <g stroke="#22304C" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 560,204 L 729.74,302 L 729.74,498 L 560,596 L 390.26,498 L 390.26,302 Z" stroke-width="1.15"/>
    <circle cx="560" cy="400" r="169.74" stroke-width="0.55" opacity="0.7"/>
    <line x1="382.25902085825004" y1="400" x2="737.7409791417499" y2="400" stroke-width="0.45" stroke-dasharray="2.4 2.6" opacity="0.6"/>
    <line x1="560" y1="222.25902085825004" x2="560" y2="577.7409791417499" stroke-width="0.45" stroke-dasharray="2.4 2.6" opacity="0.6"/>

    <!-- CAP path -->
    <circle cx="86" cy="508" r="4.2" fill="#22304C" stroke="none"/>
    <text x="86" y="492" text-anchor="middle" fill="#22304C" stroke="none" font-size="10" font-weight="700" letter-spacing="2.4">CAP</text>
    <path d="M 86,508 H 168 L 230,400 H 470" stroke-width="1.2" fill="none"/>

    <!-- private return: two major circular loops (not one circle) -->
    <path d="M 470,400 A 70 70 0 1 1 590,400" stroke-width="1.2" fill="none"/>
    <path d="M 470,400 A 70 70 0 1 0 590,400" stroke-width="1.2" fill="none"/>
    <path d="M 522,304 L 536,314 L 518,320" stroke-width="1.05" fill="none"/>
    <path d="M 522,496 L 536,486 L 518,480" stroke-width="1.05" fill="none"/>
    <text x="532" y="404" text-anchor="middle" fill="#22304C" stroke="none"
          font-size="9" font-weight="700" letter-spacing="1.6">PRIVATE RETURN</text>

    <!-- exit to public good -->
    <path d="M 590,400 H 725.7409791417499" stroke-width="1.2" fill="none"/>
    <path d="M 735.7409791417499,400 H 820 L 910,210" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

    <g stroke-dasharray="2.2 2.6" stroke-width="0.55" opacity="0.8">
      <line x1="980" y1="168" x2="1048" y2="142"/>
    <line x1="1048" y1="142" x2="1088" y2="198"/>
    <line x1="1088" y1="198" x2="1022" y2="230"/>
    <line x1="1022" y1="230" x2="980" y2="168"/>
    <line x1="980" y1="168" x2="1088" y2="198"/>
    <line x1="1048" y1="142" x2="1022" y2="230"/>
    <line x1="980" y1="168" x2="960" y2="214"/>
    <line x1="1088" y1="198" x2="1108" y2="156"/>
    </g>
